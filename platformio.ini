; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-touch-lcd-7]
; ESP32_Display_Panel requires IDF5-based Arduino core (std::string_view, esp_memory_utils.h, etc.),
; which the registry `espressif32` platform (Arduino core 2.0.17) doesn't provide.
; Use the same known-good core version as Waveshare's official PlatformIO example, which also
; avoids the ESP32-S3 RGB LCD screen-drift issue via a patched framework build.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
board = esp32-s3-devkitc-1
framework = arduino

; Pre-build hook: re-enable the RGB bounce-buffer cache-invalidate that
; ESP32_Display_Panel hardcodes off (see scripts/patch_rgb_bounce.py for the full
; rationale). The library lives under .pio/libdeps and is re-fetched on every
; `pio pkg` reinstall, so the fix is applied fresh before each build rather than
; committed to a vendored copy. Inherited by the -ota env via `extends`.
extra_scripts = pre:scripts/patch_rgb_bounce.py

; Waveshare ESP32-S3-Touch-LCD-7 uses an ESP32-S3N16R8 module:
; 16MB Quad-SPI flash + 8MB Octal-SPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Board has no native-USB-only port; UART0 goes through a USB-UART bridge,
; so plain Serial works without extra USB CDC flags.
monitor_speed = 115200
upload_speed = 921600
; BOOT INSTABILITY: a framework-level race, not something this project can patch.
;
; Symptom: "Guru Meditation Error: Core 1 panic'ed / Stack canary watchpoint triggered
; (ipc1)", inside board->begin() right after the GT911 touch init. Between 0 and 6 panics
; per boot, and which it was depended on the binary - adding a function that loop() called
; was enough to flip a 5/5 board to 2/5 with RAM usage unchanged to the byte.
;
; Cause, located with addr2line: the faulting PC is _xt_lowint1, the interrupt entry. So an
; interrupt is taken while the ipc1 task's stack is active, and that stack is
; CONFIG_ESP_IPC_TASK_STACK_SIZE = 1024 bytes. An Xtensa interrupt frame with a windowed-ABI
; spill is 250-300 of those, on top of the IPC callback's own depth - so whether it fits is
; a race between the interrupt and the deepest point of that callback. Code layout shifts
; the timing, which is why it looked like a lottery: it was one.
;
; The correct fix is CONFIG_ESP_IPC_TASK_STACK_SIZE=3072 via custom_sdkconfig. It was tried
; and REJECTED: that option switches the build to Arduino-as-an-IDF-component, which warns
; "doesn't handle the `variant` field! The default `esp32` variant will be used" - i.e. it
; would silently swap the pin definitions of an ESP32-S3 board. Not a trade worth making for
; a boot race.
;
; So this is managed rather than fixed. Run tools/bootgate.py after ANY change to main.cpp or to
; what links into the firmware, and keep the layout that passes: one boot proves nothing against
; a fault that used to appear four times in five.
;
; AND KNOW WHAT THAT GATE DOES NOT COVER. bootgate.py resets with an RTS pulse, which is an
; EXTERNAL reset. Every OTA ends on a SOFTWARE restart instead, and that path is measurably
; worse: 21 consecutive esp_restart() cycles gave 13 clean `sw`, 5 `wdt`, and 2 panics - about
; one boot in twenty needing a second attempt before the UI came up. It always did come up, and
; health.cpp's intent flag keeps our own restarts out of the crash counter, so this is a
; two-second hiccup rather than a failure. It is recorded because a gate that only tests one of
; two reset paths reads as proof of both, and this one was believed for a while.
;
; To measure the software path, build with a task that calls health_restart() a few seconds
; after health_ui_ready() and count what the next boot reports - the reset reason is in the
; [health] line, and `(ours)` marks the ones the intent flag covered.
;
; WiFi/PSRAM sdkconfig knobs - assessed, NOT reachable here.
;
; CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP, CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL and
; CONFIG_ESP_WIFI_IRAM_OPT would all help the WiFi stack, but they are baked into
; the PRECOMPILED framework libs pinned above (framework-arduinoespressif32-libs,
; the esp32-3.1.1-h.zip). A project-root sdkconfig / custom_sdkconfig is inert
; against a prebuilt lib set - the .a files are already compiled with fixed values -
; and the only way to actually change them is a full Arduino-as-IDF-component source
; build, which (per the IPC-stack note above) silently drops this board's `variant`
; and swaps the ESP32-S3 pin map. Not a trade worth making for a WiFi tune.
; So the practical levers that DON'T require a source build are: cut PSRAM pressure
; (the camnet path) and enable the RGB bounce cache-invalidate (extra_scripts above,
; the single biggest continuous WiFi contributor). Those are what we did.

build_unflags =
    -std=gnu++11
; Two things were tried against the JPEG decode, which at ~48ms a frame is the
; camera path's largest per-frame cost on this board (the network wait is ~19ms),
; and neither paid:
;
;   -O2 instead of the framework default -Os. Produced a byte-identical firmware
;   image and decode measured 50ms rather than 48ms, i.e. nothing beyond noise.
;
;   Enabling JPEGDEC's hand-written ESP32-S3 SIMD. It ships s3_simd_444.S,
;   s3_simd_420.S and s3_simd_dequant.S but gates them behind
;   __has_include("dsps_fft2r_platform.h") - esp-dsp is used purely to detect the
;   AES3 instructions - and Arduino ships that header without putting it on the
;   include path. Adding it does switch the paths on (verified with a #warning
;   probe: "S3 SIMD enabled"), and decode did not move: 48.4-48.9ms against a
;   48.5-50.0ms baseline. The reason is structural - the OV2640 emits 4:2:2 JPEGs
;   (ffprobe reports yuvj422p) and the SIMD only covers 4:2:0 and 4:4:4, so our
;   frames never reach that branch. Not worth carrying a flag that cannot apply.
build_flags =
    -DBOARD_HAS_PSRAM
    -I include
    ; The panel <-> node wire contract, shared with sensor_node/ and esp32cam-streamer/ rather
    ; than copied into each. See shared/nodeproto.h for why.
    -I shared
    -std=gnu++17
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=1
    ; The panel OLED on the UART2 header (GPIO 43/44), which are UART0's pins. Safe to
    ; leave on with the switch routing those pads to the USB bridge: the display is not
    ; reachable there, so paneloled_init() hands the pins back and the console survives.
    ; It is spent only once a display actually answers on them.
    -DPANEL_OLED=1

; PINNED, ALL OF THEM, AND WHY THE FIRST ONE IS A COMMIT.
;
; ESP32_Display_Panel had no ref at all here, which resolves to whatever its
; default branch happens to be on the day of the fetch. That was tolerable while
; the only builds were on one machine with a warm .pio; it is not tolerable now
; that GitHub Actions builds this from a cold checkout and publishes the result as
; the image panels install over the air. An unpinned display driver means the
; binary a panel pulls is not the binary anyone tested, and the failure mode is a
; screen - the one part of a greenhouse controller nobody can debug remotely.
; The sha below is the commit every build in this tree was verified against. It
; has no tag; upstream does not cut them for this library.
;
; JPEGDEC's ^1.8.2 was the same hazard one order of magnitude quieter: 1.8.4 is
; what resolved, so that is what is written down. Its own bb_spi_lcd dependency
; comes along unpinned and is left that way deliberately - nothing here links it,
; it arrives only because JPEGDEC's examples declare it.
lib_deps =
    ; Named rather than discovered. shared/srvconn.h needs WiFiClientSecure, which arrived in a
    ; framework library of its own in Arduino core 3.x - and the library dependency finder does
    ; not follow includes that come in through `-I shared`, so it never sees the reference and the
    ; build fails on a header that is sitting in the framework the whole time.
    NetworkClientSecure
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#92b790ed6d24b0678e2f45b1fc85f0abd2d41b33
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    https://github.com/lvgl/lvgl.git#v8.4.0
    bitbank2/JPEGDEC@1.8.4

; Same firmware, delivered over WiFi instead of the wire.
;
; This exists because the finished device needs the OLED on the panel, and the only pins
; physically exposed for a second I2C bus are the UART2 connector's - which a switch on the
; board shares with the USB-serial bridge. Handing them to I2C costs the console and
; esptool, so a network path in has to work FIRST. Flipping that switch back to UART1
; restores esptool, which is the escape hatch that makes the trade recoverable.
;
;   pio run -e esp32-s3-touch-lcd-7-ota -t upload
;
; Serial stays the default env, so an ordinary upload is unchanged.
[env:esp32-s3-touch-lcd-7-ota]
extends = env:esp32-s3-touch-lcd-7
upload_protocol = espota
upload_port = smartfarm-panel.local





