<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온실 보드 관리</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 12px;
  font: 16px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  background: #f4f5f7; color: #1c1e21;
}
/* One column on a phone, two once there is room. The operator reading this is holding a phone
   an hour from the greenhouse; the desktop case is the luxury one. */
main { display: grid; gap: 12px; grid-template-columns: 1fr; max-width: 900px; }
@media (min-width: 720px) { main { grid-template-columns: 1fr 1fr; } }
h1 { font-size: 20px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 20px 0 8px; }
header { max-width: 900px; margin-bottom: 12px; }
#bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
#stat { color: #5b6169; }
#stat.bad { color: #b3261e; font-weight: 600; }
.card { background: #fff; border-radius: 10px; padding: 12px 14px; box-shadow: 0 1px 3px #0002; }
.card h3 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px;
           flex-wrap: wrap; }
.mac { font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #5b6169;
       word-break: break-all; }
.rows { margin: 10px 0 0; }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-size: 15px; }
.row dt { color: #5b6169; flex: none; }
.row dd { margin: 0; text-align: right; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace;
          word-break: break-all; }
.badge { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.ok { background: #d7f0d9; color: #14602a; }
.stale { background: #fde2c4; color: #8a4b06; }
.warn { background: #fdd; color: #8a1210; }
.mute { background: #e7e9ec; color: #4a5058; }
/* 44px is the smallest target a thumb hits reliably, and the button is the reason this page
   exists - it must not be the thing that is fiddly. */
button {
  min-height: 44px; padding: 0 16px; font-size: 16px; font-weight: 600;
  border: 0; border-radius: 8px; background: #1a63d8; color: #fff;
}
button[disabled] { background: #d3d6da; color: #71777f; }
#forget { min-height: 32px; padding: 0 10px; font-size: 13px; font-weight: 400;
          background: #e7e9ec; color: #33383d; }
.act { margin-top: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.why { font-size: 13px; color: #5b6169; margin: 6px 0 0; }
.note { font-size: 13px; margin: 8px 0 0; padding: 8px 10px; border-radius: 8px;
        background: #fff5e2; color: #6b4400; }
ol#logs { list-style: none; margin: 0; padding: 0; max-width: 900px; }
ol#logs li { background: #fff; border-radius: 8px; padding: 7px 10px; margin-bottom: 6px;
             font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; word-break: break-word; }
ol#logs .meta { color: #5b6169; }
.empty { color: #5b6169; font-size: 14px; }

/* The console pane, dark regardless of the page's light chrome. This is raw serial output and it
   is read the way serial output is read everywhere else, light on dark - which also keeps the
   greenhouse's night shift from holding a lamp. */
#conbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; max-width: 900px;
          margin-bottom: 8px; }
/* 16px for the same reason every other control on this page is 16px: iOS Safari zooms the whole
   document when a control with smaller text takes focus, and it does not zoom back out. */
#condev { min-height: 44px; font-size: 16px; max-width: 100%; }
/* Grey rather than the blue of 업데이트, because these two change what the page shows and not
   what the greenhouse does - but at the full 44px, since 일시정지 is the button pressed in a
   hurry with a thumb while something scrolls past. */
#conpause, #conclear { background: #e7e9ec; color: #33383d; font-weight: 400; }
#constick { font-size: 13px; font-weight: 600; color: #8a4b06; background: #fde2c4;
            padding: 4px 8px; border-radius: 999px; }
#con {
  margin: 0; max-width: 900px; height: 50vh; overflow-y: auto; padding: 10px;
  border-radius: 8px; background: #12151a; color: #dfe3e8;
  font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
  /* pre-wrap, not pre: a panic backtrace is a hundred columns wide and a horizontal scrollbar on
     a phone hides most of it behind a gesture. Wrapped, every byte the board printed is on
     screen without one. */
  white-space: pre-wrap; word-break: break-word;
  /* This pane's scroll position is computed in script on every append and again after every trim.
     Browser scroll anchoring would also move it, from its own guess about which node to hold
     still, and the two corrections fight each other - so it is off and the arithmetic in
     conAppend is the only thing that touches scrollTop. */
  overflow-anchor: none;
}
#constat { max-width: 900px; }
#constat.bad { color: #b3261e; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>온실 보드 관리</h1>
  <div id="bar"><span id="stat">불러오는 중…</span><button id="forget">토큰 지우기</button></div>
</header>
<main id="cards"></main>
<h2>노드 로그</h2>
<ol id="logs"></ol>
<h2>보드 콘솔</h2>
<div id="conbar">
  <span id="condevbox"></span>
  <button id="conpause">일시정지</button>
  <button id="conclear">화면 지우기</button>
  <span id="constick" hidden>자동 스크롤 멈춤 · 맨 아래로 내리면 다시 따라갑니다</span>
</div>
<pre id="con"></pre>
<!-- The pane starts empty and the "nothing yet" sentence lives in #constat beside it, not inside
     it. Placeholder text inside #con would be indistinguishable from something the board printed,
     and the first real chunk would have to know to remove it. -->
<p id="constat" class="why">콘솔을 불러오는 중…</p>
<script>
"use strict";
var POLL_MS = 5000;
var KEY = "plantrx_token";
// One sentence for a rejected token, said by both the cards and the console pane. Two copies of
// it would drift, and the operator seeing two different explanations of the same 401 would have
// no way to know it is one problem.
var UNAUTH = "토큰이 거부되었습니다. 토큰을 지우고 다시 입력하세요.";
// The three boards, titled the way the panel's own 업데이트 page titles them (src/ui/page_update.cpp
// dev_title), so an operator who has read one screen recognises the other.
var TITLE = { panel: "스크린", cam: "카메라 노드", node: "센서 노드" };
// Which device_flags column says "an update is armed for this role but the panel has not collected
// it yet". This is the mapping that makes an armed pull visible: the flag lives on the panel's row
// for all three boards, because the panel is the only one of them this server can reach.
var ARMED = { panel: "update_mode", cam: "node_pull_cam", node: "node_pull_node" };

var notes = {};      // "device|role" -> the sentence a press left behind
var logSig = null;   // identity of the log rows currently in the DOM
var timer = null;

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                  .replace(/"/g, "&quot;");
}

function token() {
  var t = localStorage.getItem(KEY);
  if (t === null) {
    // Empty is a legitimate answer and is remembered as one: a development server with
    // PLANTRX_TOKEN unset accepts any Authorization header (app/main.auth), and asking again on
    // every poll would make the page unusable there.
    t = window.prompt("서버 토큰을 입력하세요. 이 브라우저에만 저장됩니다.", "");
    if (t === null) t = "";
    localStorage.setItem(KEY, t);
  }
  return t;
}

function fmtUp(s) {
  if (s < 3600) return Math.floor(s / 60) + "분";
  if (s < 86400) return Math.floor(s / 3600) + "시간 " + Math.floor((s % 3600) / 60) + "분";
  return Math.floor(s / 86400) + "일 " + Math.floor((s % 86400) / 3600) + "시간";
}

function fmtAge(sec) {
  if (sec < 0) sec = 0;
  if (sec < 10) return "방금";
  if (sec < 60) return sec + "초 전";
  if (sec < 3600) return Math.floor(sec / 60) + "분 전";
  if (sec < 86400) return Math.floor(sec / 3600) + "시간 전";
  return Math.floor(sec / 86400) + "일 전";
}

// Twelve characters of an elf_sha256, which is what the panel's log lines and this project's
// firmware log already print. It is enough to tell two builds apart by eye and short enough to sit
// on a phone line; the full hash is in /v1/firmware/latest for anybody who needs to diff it.
function shortVer(hex) { return hex ? hex.slice(0, 12) : "모름"; }

function armEndpoint(device, role) {
  var d = encodeURIComponent(device);
  // The panel updates itself through update_mode?pull=1 - the endpoint that stands its camera,
  // poll and radio down first. The nodes are not on IP from here at all, so their update is armed
  // on the panel's row and carried out over ESP-NOW. Both endpoints already exist; this page must
  // not invent a third.
  if (role === "panel") return "/v1/device/" + d + "/update_mode?pull=1";
  if (role === "cam" || role === "node") {
    return "/v1/device/" + d + "/node_update?role=" + encodeURIComponent(role);
  }
  return null;
}

function api(path, opts) {
  var o = opts || {};
  o.headers = { "Authorization": "Bearer " + token() };
  return fetch(path, o).then(function (r) {
    if (r.status === 401) { var e = new Error("unauth"); e.unauth = true; throw e; }
    if (!r.ok) {
      // The status rides along on the error because one caller has to tell 404 apart from the
      // rest: a /v1/conlog that is not deployed on this server yet is "no console here", which is
      // a different sentence from "the server is failing" and must not be shouted every 2s.
      var e2 = new Error(path + " → " + r.status);
      e2.status = r.status;
      throw e2;
    }
    return r.json();
  });
}

function setStat(text, bad) {
  var el = document.getElementById("stat");
  el.textContent = text;
  el.className = bad ? "bad" : "";
}

function roleCard(dev, role) {
  var key = dev.device + "|" + role.role;
  var url = armEndpoint(dev.device, role.role);
  var badge = role.current
    ? '<span class="badge ok">최신</span>'
    : '<span class="badge stale">업데이트 필요</span>';

  // Greyed for the same two reasons and in the same words the panel's own page uses
  // (src/ui/page_update.cpp): a board with no second app slot cannot take an image, and a role
  // with nothing published has nothing to fetch. A live-looking button whose only possible
  // outcome is a failure message minutes later is the thing both pages refuse to offer.
  var why = "";
  if (!url) why = "알 수 없는 역할이라 업데이트할 수 없음";
  else if (!role.can_ota) why = "설치 영역이 없어 업데이트 불가";
  else if (!role.published) why = "서버에 게시된 이미지 없음";

  var armed = dev.flags[ARMED[role.role]];
  var pieces = [
    '<h3>' + esc(TITLE[role.role] || role.role) + badge +
      (role.online ? "" : '<span class="badge warn">연결 끊김</span>') +
      (role.pending ? '<span class="badge stale">검증 전</span>' : "") +
      (armed ? '<span class="badge mute">요청 대기 중</span>' : "") + '</h3>',
    '<dl class="rows">',
    '<div class="row"><dt>현재 버전</dt><dd>' + esc(shortVer(role.running)) + '</dd></div>',
    '<div class="row"><dt>게시 버전</dt><dd>' + esc(shortVer(role.published)) + '</dd></div>',
    '<div class="row"><dt>가동</dt><dd>' + esc(fmtUp(role.up_s)) + '</dd></div>',
    '<div class="row"><dt>남은 메모리</dt><dd>' +
      esc(Math.floor(role.heap / 1024) + " KB") + '</dd></div>',
    '<div class="row"><dt>연결</dt><dd>' + (role.online ? "연결됨" : "끊김") + '</dd></div>',
    '<div class="row"><dt>보고 시각</dt><dd class="age" data-ts="' + role.recv_ts + '"></dd></div>',
    '</dl>',
    '<div class="act"><button data-dev="' + esc(dev.device) + '" data-role="' + esc(role.role) +
      '"' + (why ? " disabled" : "") + '>업데이트</button></div>',
  ];
  if (why) pieces.push('<p class="why">' + esc(why) + '</p>');
  if (armed) {
    // Said on every render and not only after a press, because the operator who armed this may
    // well have closed the page and come back. An armed flag with nothing on screen about it is
    // indistinguishable from a button that did nothing.
    pieces.push('<p class="note">요청이 걸려 있습니다. 패널이 다음 폴링에서 가져갈 때까지 ' +
                '아무 일도 일어나지 않습니다.</p>');
  }
  if (notes[key]) pieces.push('<p class="note">' + esc(notes[key]) + '</p>');
  return '<section class="card">' + pieces.join("") + '</section>';
}

function render(st) {
  var out = [];
  st.devices.forEach(function (dev) {
    var head = '<section class="card"><h3>' +
      (dev.last_seen ? esc(fmtAge(st.ts - dev.last_seen)) + " 응답"
                     : "최근 텔레메트리 없음") +
      '</h3><p class="mac">' + esc(dev.device) + '</p>';
    if (!dev.roles.length) {
      head += '<p class="why">이 보드의 펌웨어는 아직 버전을 보고하지 않습니다. ' +
              '한 번 업데이트하면 이 페이지에 카드가 나타납니다.</p>';
    }
    out.push(head + '</section>');
    dev.roles.forEach(function (role) { out.push(roleCard(dev, role)); });
  });
  if (!out.length) out.push('<p class="empty">아직 보고한 보드가 없습니다.</p>');
  document.getElementById("cards").innerHTML = out.join("");

  // The log list is the one thing not rebuilt on every poll. It is the longest list on the page
  // and it is usually identical five seconds later, and rebuilding it would drop the operator's
  // scroll position and their text selection - which on a log pane is the thing they are using it
  // for. The signature is the row identity, so a new line at the top is what rebuilds it.
  var sig = st.logs.map(function (r) {
    return r.recv_ts + "/" + r.ms + "/" + r.role;
  }).join(",");
  if (sig !== logSig) {
    logSig = sig;
    document.getElementById("logs").innerHTML = st.logs.map(function (r) {
      return '<li><span class="meta">[' + esc(r.role) + '] <span class="age" data-ts="' +
        r.recv_ts + '"></span></span> ' + esc(r.text) + '</li>';
    }).join("");
  }
  // Ages are refreshed whether or not anything was rebuilt: they are relative to st.ts, so a pane
  // that was left alone would otherwise freeze its clock while the numbers beside it moved.
  var ages = document.querySelectorAll(".age");
  for (var i = 0; i < ages.length; i++) {
    ages[i].textContent = fmtAge(st.ts - Number(ages[i].getAttribute("data-ts")));
  }
  conSyncDevices(st);
}

function poll() {
  api("/v1/admin/state").then(function (st) {
    render(st);
    setStat("갱신 " + new Date(st.ts * 1000).toLocaleTimeString("ko-KR"), false);
    schedule();
  }).catch(function (err) {
    if (err.unauth) {
      // Said out loud rather than left as an empty page, which is what this looked like before:
      // a wrong token and a server that is down are the same blank screen otherwise, and one of
      // them is fixed by typing.
      setStat(UNAUTH, true);
      return;   // no reschedule: retrying a rejected token every 5s answers nothing
    }
    setStat("서버에 연결할 수 없습니다: " + err.message, true);
    schedule();
  });
}

// setTimeout after each answer rather than setInterval, so a slow link stretches the cadence
// instead of stacking requests behind each other - on a mobile connection an interval shorter
// than the round trip queues polls until the page is doing nothing but catching up.
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(poll, POLL_MS);
}

document.getElementById("forget").addEventListener("click", function () {
  localStorage.removeItem(KEY);
  location.reload();
});

document.getElementById("cards").addEventListener("click", function (ev) {
  var btn = ev.target.closest("button[data-role]");
  if (!btn || btn.disabled) return;
  var dev = btn.getAttribute("data-dev"), role = btn.getAttribute("data-role");
  btn.disabled = true;
  api(armEndpoint(dev, role), { method: "POST" }).then(function () {
    notes[dev + "|" + role] =
      "업데이트를 요청했습니다. 패널의 다음 폴링(최대 1분)까지는 아무 일도 일어나지 않습니다.";
    poll();   // immediately, so the armed flag appears in the same breath as the note
  }).catch(function (err) {
    notes[dev + "|" + role] = err.unauth
      ? "토큰이 거부되어 요청하지 못했습니다."
      : "요청하지 못했습니다: " + err.message;
    btn.disabled = false;
    poll();
  });
});

// ---- The raw console --------------------------------------------------------------------------
//
// The panel already keeps its whole serial log in a PSRAM ring and already serves it, on TCP/23.
// That is perfect and unreachable: port 23 exists on the greenhouse LAN, and the operator reading
// this page is an hour away on a phone. This pane is those same bytes, over the same HTTP and the
// same bearer as the rest of the page.
//
// It tails CHUNKS, not lines. /v1/conlog answers raw slices of the stream, and a slice may begin
// or end mid-line; they are concatenated exactly as they arrive and nothing here splits, trims or
// re-joins them. Reassembling lines would produce a pane that reads plausibly and is not what the
// board printed, and a console that lies about a backtrace is worse than no console.
var CON_MS = 2000;
var CON_RETRY_MS = 15000;
var CON_LIMIT = 64;      // the endpoint's own default, sent explicitly so the cadence math is here
// The panel emits roughly 15KB a minute, so an unbounded pane is a phone tab that dies after an
// hour. 240,000 characters is about 16 minutes of that. Past the cap the pane is trimmed back to
// 180,000 (about 12 minutes) rather than to the cap itself: trimming to exactly the cap would mean
// rebuilding the whole node on every 2s poll from then on, and this way that rebuild happens about
// once every four minutes.
var CON_CAP = 240000;
var CON_KEEP = 180000;
// "At the bottom" means within 24px of it, not exactly at it. scrollHeight, scrollTop and
// clientHeight are fractional on a phone at any zoom but 100%, so an exact comparison is never
// true there and the pane would refuse to stick for the entire session.
var CON_STICK_PX = 24;

var conDev = null;     // whose stream is in the pane
var conDevSig = null;  // identity of the device list the chooser was built from
var conSince = {};     // device -> highest chunk id already appended, kept per device
var conText = "";      // the pane's exact bytes, mirrored here so trimming is string work
var conPaused = false;
var conStick = true;   // following the tail, until the operator scrolls up
var conDead = false;   // a 401 stopped the tail for good; only a new token restarts it
var conTimer = null;

function conSay(text, bad) {
  var el = document.getElementById("constat");
  el.textContent = text;
  el.className = bad ? "why bad" : "why";
}

// clearTimeout first, always: pause, clear, a device switch and a reply in flight can all want to
// arm this, and two live timers would double the poll rate for the rest of the session.
function conSchedule(ms) {
  clearTimeout(conTimer);
  conTimer = setTimeout(conPoll, ms);
}

function conAppend(text) {
  var el = document.getElementById("con");
  // A text node rather than textContent +=, which re-serialises and re-lays-out the entire pane on
  // every poll. Appending below the viewport moves nothing the reader is looking at.
  el.appendChild(document.createTextNode(text));
  conText += text;
  if (conText.length > CON_CAP) {
    var cut = conText.length - CON_KEEP;
    // Cut forward to the next newline so the oldest thing on screen is a whole line. Losing the
    // remains of a line is honest; showing its tail flush left, as though the board printed a line
    // that started there, is not.
    var nl = conText.indexOf("\n", cut);
    conText = conText.slice(nl < 0 ? cut : nl + 1);
    // Both of these are read BEFORE the replacement, and the scrollTop especially: shrinking the
    // box makes the browser clamp scrollTop to the new maximum on the spot, so reading it
    // afterwards gives a number the browser has already corrected once, and subtracting the
    // removed height from THAT scrolls the reader a second time. Measured: a 32,000px trim moved
    // the text 13,000px under the eye until this was read up here.
    var was = el.scrollHeight, top = el.scrollTop;
    el.textContent = conText;
    // The trim removed content ABOVE the reader, so everything they are reading slid up by exactly
    // the height that went away. Give it back, or a reader parked on a backtrace is yanked forward
    // every time the cap is hit - which is the one thing this pane must never do.
    if (!conStick) el.scrollTop = Math.max(0, top - (was - el.scrollHeight));
  }
  if (conStick) el.scrollTop = el.scrollHeight;
}

function conSetDevice(dev) {
  if (dev === conDev) return;
  conDev = dev;
  // The pane holds one board's stream. Two consoles interleaved in one <pre> would put the camera
  // node's lines under the panel's name, so a switch starts from empty. The per-device cursor is
  // kept, so what arrives next is what that board printed after the last chunk that was shown.
  conText = "";
  document.getElementById("con").textContent = "";
  conStick = true;
  document.getElementById("constick").hidden = true;
  conSay("콘솔을 불러오는 중…", false);
  conSchedule(0);
}

function conSyncDevices(st) {
  var list = st.devices.map(function (d) { return d.device; });
  if (!list.length) {
    conDev = null;
    conDevSig = null;
    document.getElementById("condevbox").innerHTML = "";
    conSay("보고한 보드가 없어 붙일 콘솔이 없습니다.", false);
    return;
  }
  // A device that stopped being listed keeps its cursor in conSince and loses the pane.
  if (list.indexOf(conDev) < 0) conSetDevice(list[0]);

  var sig = list.join(",");
  if (sig === conDevSig) return;   // rebuilt only when the list itself changes: a <select>
  conDevSig = sig;                 // rebuilt every 5s would close under the operator's thumb
  // A chooser with one option is furniture - a thumb-width of screen spent offering a choice that
  // has already been made. Most greenhouses are one panel, so the ordinary page has no chooser and
  // simply tails it; the select appears the day a second board reports.
  var box = document.getElementById("condevbox");
  if (list.length < 2) { box.innerHTML = ""; return; }
  box.innerHTML = '<select id="condev">' + list.map(function (d) {
    return '<option value="' + esc(d) + '"' + (d === conDev ? " selected" : "") + '>' +
           esc(d) + '</option>';
  }).join("") + '</select>';
  document.getElementById("condev").addEventListener("change", function () {
    conSetDevice(this.value);
  });
}

function conPoll() {
  if (conPaused || conDead || !conDev) return;
  var dev = conDev, since = conSince[dev] || 0;
  api("/v1/conlog?device=" + encodeURIComponent(dev) + "&since=" + since + "&limit=" + CON_LIMIT)
    .then(function (r) {
      // Switched while this was in flight. These bytes are another board's and conSetDevice has
      // already armed the timer for the new one, so they are dropped rather than interleaved.
      if (dev !== conDev) return;
      // Never let the cursor go backwards - not even if the server says so. A since that regressed
      // would re-request chunks that are already on screen and append them again, and a console
      // that repeats itself is indistinguishable from a board stuck in a loop.
      var next = Number(r.next);
      if (next > since) conSince[dev] = next;
      var rows = r.rows || [];
      if (rows.length) {
        conAppend(rows.map(function (c) { return c.text; }).join(""));
      }
      conSay(conText ? "" : "아직 콘솔에 들어온 내용이 없습니다.", false);
      conSchedule(CON_MS);
    })
    .catch(function (err) {
      if (err.unauth) {
        // Then stop: re-asking a rejected token every two seconds answers nothing, and 토큰 지우기
        // reloads the page, which is what restarts this.
        conDead = true;
        conSay(UNAUTH, true);
        return;
      }
      // Whatever is in the pane is left exactly as it is. Blanking it would throw away the lines
      // the operator is in the middle of reading, and those lines are still true - all that has
      // happened is that no newer ones arrived.
      //
      // 404 included, deliberately, at the same slower cadence: a server without the route yet is
      // an ordinary state of this page and not an error, and backing off to 15s means the pane
      // picks the console up by itself once the route is deployed, with no reload.
      if (err.status === 404) {
        conSay("이 서버에는 아직 콘솔 기록이 없습니다. 15초마다 다시 확인합니다.", false);
      } else {
        conSay("콘솔을 가져오지 못했습니다: " + err.message + " · 15초 후 다시 시도합니다.", true);
      }
      conSchedule(CON_RETRY_MS);
    });
}

document.getElementById("con").addEventListener("scroll", function () {
  var at = this.scrollHeight - this.scrollTop - this.clientHeight <= CON_STICK_PX;
  if (at === conStick) return;
  conStick = at;
  // Said out loud, because a pane that has quietly stopped following looks exactly like a board
  // that has stopped printing, and one of those is fixed by scrolling down.
  document.getElementById("constick").hidden = at;
});

document.getElementById("conpause").addEventListener("click", function () {
  conPaused = !conPaused;
  this.textContent = conPaused ? "계속" : "일시정지";
  if (conPaused) {
    // The fetch stops, not just the drawing. The point of the button is a phone that is not
    // pulling 15KB a minute over a mobile link while nobody is reading it, so it says so rather
    // than letting the operator assume the board went quiet. The cursor stays where it stopped, so
    // 계속 resumes from that chunk - 64 chunks a poll means a long pause takes a few polls to
    // catch up.
    clearTimeout(conTimer);
    conSay("가져오기를 멈췄습니다. 보드는 계속 출력하고 있고, 계속을 누르면 멈춘 지점부터 " +
           "이어서 받습니다.", false);
    return;
  }
  if (conDead) { conSay(UNAUTH, true); return; }   // resuming cannot fix a rejected token
  conSay("콘솔을 불러오는 중…", false);
  conSchedule(0);
});

document.getElementById("conclear").addEventListener("click", function () {
  conText = "";
  document.getElementById("con").textContent = "";
  conStick = true;
  document.getElementById("constick").hidden = true;
  // The view only. The cursor is untouched, so this does not re-fetch what was cleared and does
  // not delete anything on the server: it is a "I am reading from here" button, which is what an
  // operator wants right before they make the board do something.
  conSay("화면만 지웠습니다. 지금부터 들어오는 것만 보입니다.", false);
});

poll();
</script>
</body>
</html>
