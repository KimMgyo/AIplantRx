; Sensor node: SCD41 (CO2 + temp/humidity) + DHT11 (temp/humidity fallback)
; + BH1750FVI (lux) + MLX90640 (32x24 thermal camera), all on one shared I2C
; bus. Broadcasts readings to the S3 over ESP-NOW every ~4s and a fragmented
; thermal frame every ~2s. Plain ESP32 DevKit V4.
; The Melexis driver lives in lib/mlx90640/ and is picked up automatically.
[env:esp32dev]
; PINNED, and to the same toolchain the panel pins (../platformio.ini). Bare `espressif32`
; resolved to Arduino core 3.1.1 on the bench only because the panel had installed pioarduino
; 53.03.11 under that name first - a clean checkout gets the registry's 6.x and Arduino core
; 2.0.17 instead, so a CI build of this firmware was building something the bench never tested.
;
; One toolchain for all three firmwares, not three that happen to agree. These images
; static_assert their wire structs against shared/nodeproto.h and are compared byte-for-byte by
; elf_sha256; two different cores mean two different definitions of "the same build".
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; OTA, and the flash write that has to happen once by hand.
;
; esp32dev defaults to default.csv: two 1.25MB app slots. This image is already 0.93MB and the
; WiFi + HTTP client that OTA needs pushes it past 1.1MB, which leaves no room to grow before a
; build starts failing to link. min_spiffs.csv is the same two-slot layout with 1.9MB each,
; bought back from a SPIFFS partition nothing on this node mounts.
;
; A partition table only takes effect on a flash that writes it, so the FIRST upload after this
; change must be over USB. An OTA image installs into a slot the running table describes, so a
; node still running the old table would write 1.9MB into a 1.25MB slot and refuse.
board_build.partitions = min_spiffs.csv

; The panel <-> node wire contract. One header, three firmwares, no "MUST match" comments.
build_flags =
    -I ../shared

; NAMED RATHER THAN DISCOVERED, and the difference is the whole reason this line exists.
;
; PlatformIO's dependency finder walks the includes it can see in src/. It does NOT walk into
; headers reached through -I ../shared, so the <WiFiClientSecure.h> inside shared/srvconn.h is
; invisible to it and NetworkClientSecure never gets compiled. The build then fails on a missing
; header, which reads like a broken include path rather than a scanner that cannot see through
; one level of indirection.
;
; THE BARE NAME, not a path. "framework-arduinoespressif32/libraries/NetworkClientSecure" is the
; obvious thing to write and PlatformIO reads the slashes as a VCS URL: it aborts with
; "VCS: Unknown repository type" before it compiles anything. The name on its own resolves against
; the bundled framework libraries, which is where this one lives.
lib_deps =
    NetworkClientSecure

