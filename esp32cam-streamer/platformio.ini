; ESP32-CAM (AI-Thinker) WiFi camera streamer.
; Serves RTSP (rtsp://<ip>:8554/mjpeg/1) and HTTP (/rgb/image, /rgb/stream)
; to the SmartFarm display board and anything else on the LAN.
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
upload_port = COM7
upload_speed = 115200
; This CH340 adapter does drive the reset lines, so the normal esptool dance
; works. If a flash ever fails with "Failed to connect", the CAM-MB clone's
; auto-reset has gone flaky again: enter download mode by hand (hold IO0, tap
; RST, release) and switch --before back to no_reset for that flash.
upload_flags =
    --before=default_reset
    --after=hard_reset
monitor_speed = 115200
; RTSP_REQUIRE_TCP: serve RTSP over TCP interleaved only. This link stalls for
; hundreds of ms at a time and RTP has no retransmission, so a UDP viewer freezes
; and then drops the session; TCP rides the same stalls out. Set to 0 to allow UDP.
build_flags =
    -DBOARD_HAS_PSRAM
    -DRTSP_REQUIRE_TCP=1
; Micro-RTSP is vendored under lib/Micro-RTSP rather than pulled from git: it
; carries a local fix for the SETUP response, which upstream fills with
; 127.0.0.1 and which makes RTSP-over-UDP unusable. A lib_deps checkout would
; silently discard it. See lib/Micro-RTSP/README.
