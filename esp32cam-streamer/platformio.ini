; ESP32-CAM (AI-Thinker) WiFi camera streamer.
; Serves RTSP (rtsp://<ip>:8554/mjpeg/1) and HTTP (/rgb/image, /rgb/stream)
; to the SmartFarm display board and anything else on the LAN.
[env:esp32cam]
; PINNED, and to the same toolchain the panel pins (../platformio.ini). Bare `espressif32`
; resolved to Arduino core 3.1.1 on the bench only because the panel had installed pioarduino
; 53.03.11 under that name first - a clean checkout gets the registry's 6.x and Arduino core
; 2.0.17 instead, so a CI build of this firmware was building something the bench never tested.
;
; One toolchain for all three firmwares, not three that happen to agree. These images
; static_assert their wire structs against shared/nodeproto.h and are compared byte-for-byte by
; elf_sha256; two different cores mean two different definitions of "the same build".
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
board = esp32cam
framework = arduino
upload_port = COM7
upload_speed = 115200
; This CH340 adapter does drive the reset lines, so the normal esptool dance
; works. If a flash ever fails with "Failed to connect", the CAM-MB clone's
; auto-reset has gone flaky again: enter download mode by hand (hold IO0, tap
; RST, release) and switch --before back to no_reset for that flash.
upload_flags =
    --before=default_reset
    --after=hard_reset
monitor_speed = 115200

; OTA, and why this line is the difference between a feature and a dead button.
;
; The esp32cam board definition ships huge_app.csv: ONE 3MB app partition. A board built that way
; cannot install an image at all - esp_ota_get_next_update_partition() returns NULL, and there is
; no runtime workaround, only a different table. min_spiffs.csv gives two 1.9MB slots; this image
; is 1,193,168 bytes with the TLS stack in it, so it fits with room over.
;
; The first upload after this change must be over USB, for the same reason as the sensor node's:
; the table itself only gets written by a wired flash. The panel reads NODEF_CAN_OTA out of every
; report and greys the button out rather than offering an update that cannot land, so a CAM left
; on the old table says so on the screen instead of failing halfway.
board_build.partitions = min_spiffs.csv
; RTSP_REQUIRE_TCP: serve RTSP over TCP interleaved only. This link stalls for
; hundreds of ms at a time and RTP has no retransmission, so a UDP viewer freezes
; and then drops the session; TCP rides the same stalls out. Set to 0 to allow UDP.
build_flags =
    -DBOARD_HAS_PSRAM
    -DRTSP_REQUIRE_TCP=1
    ; The panel <-> node wire contract. One header, three firmwares.
    -I ../shared

; NetworkClientSecure, which is where WiFiClientSecure.h lives in Arduino core 3.x. Named rather
; than discovered: the LDF only follows includes it finds in this project's own sources, and the
; header is included by shared/srvconn.h, which arrives through the -I above. Without this line
; nothing in the dependency graph mentions it and nodeagent.cpp fails to compile on a missing
; WiFiClientSecure.h. Bundled with the framework, so it pins nothing the platform block does not.
lib_deps =
    NetworkClientSecure

; Micro-RTSP is vendored under lib/Micro-RTSP rather than pulled from git: it
; carries a local fix for the SETUP response, which upstream fills with
; 127.0.0.1 and which makes RTSP-over-UDP unusable. A lib_deps checkout would
; silently discard it. See lib/Micro-RTSP/README.
