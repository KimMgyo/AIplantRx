font-weight="400">플래시 · 쓰지 말 것</text><text x="432" y="734" font-size="10" text-anchor="start" fill="#6b7280" font-weight="400">19</text><text x="450" y="734" font-size="12" text-anchor="start" fill="#111827" font-weight="400">5V</text><text x="322" y="734" font-size="12" text-anchor="end" fill="#dc2626" font-weight="600">✕ 연결 안 함 (USB 5V와 강압 5V를 떼어 둠)</text><text x="668" y="194" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">1</text><text x="650" y="194" font-size="12" text-anchor="end" fill="#111827" font-weight="600">GND</text><text x="778" y="194" font-size="12" text-anchor="start" fill="#111827" font-weight="400">GND 연결선 → 12V − (꼭)</text><text x="668" y="224" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">2</text><text x="650" y="224" font-size="12" text-anchor="end" fill="#111827" font-weight="600">IO23</text><text x="778" y="224" font-size="12" text-anchor="start" fill="#111827" font-weight="400">링 DIN</text><text x="668" y="254" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">3</text><text x="650" y="254" font-size="12" text-anchor="end" fill="#111827" font-weight="600">IO22</text><text x="778" y="254" font-size="12" text-anchor="start" fill="#111827" font-weight="400">SCL → SCD41, MLX90640</text><text x="668" y="284" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">4</text><text x="650" y="284" font-size="12" text-anchor="end" fill="#6b7280" font-weight="400">TX0</text><text x="778" y="284" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">USB 시리얼 (CP2102N) · 비움</text><text x="668" y="314" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">5</text><text x="650" y="314" font-size="12" text-anchor="end" fill="#6b7280" font-weight="400">RX0</text><text x="778" y="314" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">USB 시리얼 (CP2102N) · 비움</text><text x="668" y="344" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">6</text><text x="650" y="344" font-size="12" text-anchor="end" fill="#111827" font-weight="600">IO21</text><text x="778" y="344" font-size="12" text-anchor="start" fill="#111827" font-weight="400">SDA → SCD41, MLX90640</text><text x="668" y="374" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">7</text><text x="650" y="374" font-size="12" text-anchor="end" fill="#111827" font-weight="600">GND</text><text x="778" y="374" font-size="12" text-anchor="start" fill="#111827" font-weight="400">SCD41·MLX90640·MAX485 GND</text><text x="668" y="404" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">8</text><text x="650" y="404" font-size="12" text-anchor="end" fill="#111827" font-weight="600">IO19</text><text x="778" y="404" font-size="12" text-anchor="start" fill="#111827" font-weight="400">RX1 ← 1kΩ ← CAM U0T</text><text x="668" y="434" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">9</text><text x="650" y="434" font-size="12" text-anchor="end" fill="#111827" font-weight="600">IO18</text><text x="778" y="434" font-size="12" text-anchor="start" fill="#111827" font-weight="400">TX1 → 1kΩ → CAM U0R</text><text x="668" y="464" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">10</text><text x="650" y="464" font-size="12" text-anchor="end" fill="#6b7280" font-weight="400">IO5</text><text x="778" y="464" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">부팅 핀 · 비움</text><text x="668" y="494" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">11</text><text x="650" y="494" font-size="12" text-anchor="end" fill="#111827" font-weight="600">IO17</text><text x="778" y="494" font-size="12" text-anchor="start" fill="#111827" font-weight="400">TX2 → MAX485 DI</text><text x="668" y="524" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">12</text><text x="650" y="524" font-size="12" text-anchor="end" fill="#111827" font-weight="600">IO16</text><text x="778" y="524" font-size="12" text-anchor="start" fill="#111827" font-weight="400">RX2 ← MAX485 RO</text><text x="668" y="554" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">13</text><text x="650" y="554" font-size="12" text-anchor="end" fill="#111827" font-weight="600">IO4</text><text x="778" y="554" font-size="12" text-anchor="start" fill="#111827" font-weight="400">MAX485 DE+RE (HIGH = 송신)</text><text x="668" y="584" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">14</text><text x="650" y="584" font-size="12" text-anchor="end" fill="#6b7280" font-weight="400">IO0</text><text x="778" y="584" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">BOOT 버튼 · 비움</text><text x="668" y="614" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">15</text><text x="650" y="614" font-size="12" text-anchor="end" fill="#6b7280" font-weight="400">IO2</text><text x="778" y="614" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">부팅 핀 · 비움</text><text x="668" y="644" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">16</text><text x="650" y="644" font-size="12" text-anchor="end" fill="#6b7280" font-weight="400">IO15</text><text x="778" y="644" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">부팅 핀 · 비움</text><text x="668" y="674" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">17</text><text x="650" y="674" font-size="12" text-anchor="end" fill="#6b7280" font-weight="400">SD1</text><text x="778" y="674" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">플래시 · 쓰지 말 것</text><text x="668" y="704" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">18</text><text x="650" y="704" font-size="12" text-anchor="end" fill="#6b7280" font-weight="400">SD0</text><text x="778" y="704" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">플래시 · 쓰지 말 것</text><text x="668" y="734" font-size="10" text-anchor="end" fill="#6b7280" font-weight="400">19</text><text x="650" y="734" font-size="12" text-anchor="end" fill="#6b7280" font-weight="400">CLK</text><text x="778" y="734" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">플래시 · 쓰지 말 것</text><text x="30" y="870" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">색 있는 선 = 쓰는 핀(색은 배선도와 같음). 빈 회색 동그라미 = 비움.</text><text x="30" y="892" font-size="12" text-anchor="start" fill="#111827" font-weight="400">SD0~3·CMD·CLK는 모듈 플래시가 쓰는 핀이라 손대면 안 됩니다. 0·2·5·12·15는 켤 때 상태를 보는 부팅 핀이라 비워 둡니다.</text><text x="30" y="914" font-size="12" text-anchor="start" fill="#111827" font-weight="400">남는 핀: IO13, IO14 (입출력), IO35·VP 36·VN 39 (입력 전용).</text><text x="30" y="936" font-size="12" text-anchor="start" fill="#111827" font-weight="400">GND는 세 개를 나눠 씁니다: 오1 = 12V − 연결선, 오7 = 센서·MAX485, 왼14 = 펌프 모듈·PC817C.</text><text x="30" y="958" font-size="12" text-anchor="start" fill="#111827" font-weight="400">납땜 전에 보드 실크 글자와 한 번 맞춰 보세요.</text></svg>