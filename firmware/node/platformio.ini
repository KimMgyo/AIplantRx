; AIplantRx sensor node: ESP32 devkit (HG-ESP32-DEVKIT V4, CP2102N) in the grow box. See src/main.cpp.
;
;   pio run -e node -t upload --upload-port COMxx     devkit USB-C (first flash: writes the partition table)
;   pio run -e node-ota -t upload                     Wi-Fi (espota, aiplantrx-node.local)
;
; Normally the S3 installs it from the GitHub release (INTERFACES.md 5).

[env:node]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
framework = arduino
board = esp32dev
; Two 1.9 MB app slots (default.csv's 1.25 MB is too tight once Wi-Fi + TLS for the GitHub download are in).
board_build.partitions = min_spiffs.csv
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"0.1.1\"
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    adafruit/Adafruit NeoPixel@1.12.3
    symlink://../common

[env:node-ota]
extends = env:node
upload_protocol = espota
upload_port = aiplantrx-node.local
