; AIplantRx v2 S3 (Waveshare ESP32-S3-Touch-LCD-7): main screen and settings.
;
;   pio run -t upload                 USB (UART switch on UART1)
;   pio run -e s3-ota -t upload       Wi-Fi (espota, aiplantrx-s3.local)
;
; Board bring-up, the pinned display stack and the RGB bounce-buffer patch come from smartfarm, where
; they were measured on this board (smartfarm/platformio.ini has the notes). Fonts, icons and the glass
; background are generated before each build by tools/gen_assets.py.

[platformio]
default_envs = s3

[env:s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3N16R8: 16 MB QSPI flash, 8 MB OPI PSRAM. NVS stays at 0x9000 (same as smartfarm), so the
; saved Wi-Fi survives the switch to this firmware.
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
upload_speed = 921600
extra_scripts =
    pre:scripts/patch_rgb_bounce.py
    pre:scripts/patch_lvgl.py
    pre:scripts/assets_hook.py
; -O2 instead of the framework's -Os: LVGL's software renderer runs about a third faster, and the app
; partition (7.5 MB) has room for the bigger code.
build_unflags = -std=gnu++11 -Os
build_flags =
    -DBOARD_HAS_PSRAM
    -I include
    -std=gnu++17
    -O2
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"2.1.3\"
lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#92b790ed6d24b0678e2f45b1fc85f0abd2d41b33
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    https://github.com/lvgl/lvgl.git#v8.4.0
    bitbank2/JPEGDEC@1.8.4
    bblanchon/ArduinoJson@7.2.1
    NetworkClientSecure

[env:s3-ota]
extends = env:s3
upload_protocol = espota
upload_port = aiplantrx-s3.local

; Through the C3's USB port (UART switch stays on UART2): the C3 sees esptool's SYNC, sends
; "aipx-download" (devsrv.cpp), the S3 restarts into its ROM loader and the C3 copies bytes both ways,
; following the baud change.  Tested 2026-11-21 with firmware/c3_hwtest: 4.2 MB app in 47 s at 460800.
;   pio run -e s3-relay -t upload --upload-port <C3 COM port>
; Writes only otadata (boot_app0, so app0 boots next) and the app, not the bootloader.  Needs esptool
; 4.9 or newer for --after watchdog_reset (the S3 has no reset line here); the platform's own 4.8.5 lacks
; it, so this runs the esptool in the shared packages folder (4.11.0 on 2026-11-21).  --connect-attempts:
; the C3 needs 2 to 8 s to bring the S3 into its loader before esptool's SYNC gets through.
[env:s3-relay]
extends = env:s3
upload_protocol = custom
upload_command = "$PYTHONEXE" "${platformio.packages_dir}/tool-esptoolpy/esptool.py" --chip esp32s3 --port $UPLOAD_PORT --baud 460800 --before no_reset --after watchdog_reset --connect-attempts 30 write_flash 0xe000 "${platformio.packages_dir}/framework-arduinoespressif32/tools/partitions/boot_app0.bin" 0x10000 $SOURCE
