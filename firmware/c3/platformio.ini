; AIplantRx display unit: ESP32-C3 SuperMini (OLEDs, S3 upload relay). See src/main.cpp.
;
;   pio run -e c3 -t upload --upload-port COMxx        C3 USB-C (first flash: writes the partition table)
;   pio run -e c3-ota -t upload                        Wi-Fi (espota, aiplantrx-oled.local)
;
; The C3's USB carries the S3 relay, so the firmware prints nothing on it by itself.

[env:c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
; Two 1.9 MB app slots: Wi-Fi + TLS (OTA from GitHub) + the OLED fonts do not fit default.csv's 1.25 MB.
board_build.partitions = min_spiffs.csv
extra_scripts = pre:scripts/short_includes.py
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"1.0.2\"
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@7.2.1
    symlink://../common

[env:c3-ota]
extends = env:c3
upload_protocol = espota
upload_port = aiplantrx-oled.local
