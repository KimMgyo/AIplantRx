; AIplantRx 화면부 C3 하드웨어 시험 펌웨어 (진짜 C3 펌웨어 아님). 설명은 src/main.cpp 머리말.
;
;   pio run -t upload --upload-port COMxx      C3 USB-C
;   pio device monitor -p COMxx                결과 보기 ("scan" 입력하면 I2C 다시 검사)
;
; 보드 설정은 ld1125h-lab에서 C3 SuperMini로 쓰던 것과 같음.

[env:c3-hwtest]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
