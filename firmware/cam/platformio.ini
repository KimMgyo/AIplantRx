; AIplantRx camera: AI-Thinker ESP32-CAM (OV2640, 4 MB PSRAM) in the grow box. See src/main.cpp.
;
;   pio run -e cam-wired -t upload     through the sensor node's bridge (devkit TCP 4000 -> CAM UART0).
;                                      First flash (writes the partition table) and the way back when
;                                      Wi-Fi OTA is broken. 12 V must be on (it powers the CAM).
;   pio run -e cam-ota -t upload       Wi-Fi (espota, aiplantrx-cam.local)
;
; Normally the S3 installs it from the GitHub release (INTERFACES.md 5). The CAM has no USB of its own.

[env:cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
framework = arduino
board = esp32cam
; Two 1.9 MB app slots (the board's default huge_app.csv has one, so it could never take an update).
board_build.partitions = min_spiffs.csv
; 115200 only: the CAM-MB's CH340 stopped answering after one try at 460800 (2026-11-21), and the
; sensor node's bridge does not follow a baud change.
;   pio run -e cam -t upload --upload-port COMxx   CAM-MB USB (CH340, auto reset), bench only
upload_speed = 115200
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"0.1.1\"
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    symlink://../common

[env:cam-wired]
extends = env:cam
; aiplantrx-node.local if mDNS resolves on this PC, else the devkit's address.
upload_port = socket://aiplantrx-node.local:4000
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset

[env:cam-ota]
extends = env:cam
upload_protocol = espota
upload_port = aiplantrx-cam.local
